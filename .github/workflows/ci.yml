name: CI — Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Tests Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: 🔬 Tests unitarios — Modelos
        run: pytest tests/test_models.py -v --tb=short
        env:
          DATABASE_URL: "sqlite:///:memory:"

      - name: 🔬 Tests unitarios — Scanner
        run: pytest tests/test_scanner.py -v --tb=short
        env:
          DATABASE_URL: "sqlite:///:memory:"

      - name: 🔬 Tests unitarios — Reglas de detección
        run: pytest tests/test_rules.py -v --tb=short
        env:
          DATABASE_URL: "sqlite:///:memory:"

      - name: 📊 Cobertura de tests
        run: |
          pytest tests/test_models.py tests/test_scanner.py tests/test_rules.py \
                 --cov=core --cov=scanner --cov=detect \
                 --cov-report=term-missing \
                 -q
        env:
          DATABASE_URL: "sqlite:///:memory:"
